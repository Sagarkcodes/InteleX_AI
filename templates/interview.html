{% extends "base.html" %}
{% block content %}

<div class="interview-container">
  <div class="agent-side">
    <img src="{{ url_for('static', filename='img/InteleX_logo.png') }}" alt="AI Agent" class="agent-avatar pulse-glow" />
    <h2 class="agent-title">InteleX AI<br><span>Personality Assistant</span></h2>
  </div>

  <div class="interaction-side">
    <div class="instruction-box">
      <p id="ai-instruction">Loading AI instructions...</p>
    </div>

    <div class="paragraph-box hidden" id="paragraph-box">
      <h3>📖 Please read this paragraph aloud:</h3>
      <p id="reading-text">Loading paragraph...</p>
    </div>

    <div class="controls hidden" id="controls">
      <button id="start-recording" class="btn btn-primary">🎙️ Start Recording</button>
      <button id="stop-recording" class="btn btn-danger" disabled>⏹️ Submit</button>
      <p id="record-timer">Recording Time: 00:00</p>
      <p id="status-text"></p>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
{% endblock %}
