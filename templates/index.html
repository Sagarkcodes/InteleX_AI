<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteleX - Resume Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>InteleX</h1>
        <p class="status-message" id="statusMessage">Your journey to a personalized assessment starts here. Upload your resume to begin.</p>
        
        <form id="uploadForm" method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
            <div class="file-upload-container">
                <label for="resumeInput">
                    <span class="file-upload-label">
                        Drag & drop your resume here or <span>browse files</span>
                    </span>
                </label>
                <input type="file" id="resumeInput" name="resume" accept=".pdf,.docx" required>
            </div>
            <input type="submit" value="Upload & Continue" class="upload-button">
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
