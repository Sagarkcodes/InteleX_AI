{% extends "base.html" %}
{% block content %}

<section class="register-section animate-fade-in">
  <div class="register-container">
    <h2>Register Candidate</h2>
    <form action="{{ url_for('register') }}" method="POST" class="register-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="role">Target Role</label>
        <input type="text" id="role" name="role" placeholder="e.g., Data Analyst">
      </div>

      <button type="submit" class="btn-submit">Continue</button>
    </form>
  </div>
</section>

{% endblock %}
