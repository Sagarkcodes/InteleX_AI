<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteleX - Live Interview</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* This is the main CSS for the live interview layout */
        .interview-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            grid-template-rows: auto 1fr;
            gap: 20px;
            height: 90vh;
            padding: 20px;
        }
        
        /* The user's video feed container in the top-right corner */
        .user-video-container {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            position: relative;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 168, 132, 0.4);
            max-width: 300px;
            justify-self: end;
        }

        #userVideo {
            width: 100%;
            display: block;
        }

        /* The InteleX AI agent container and question box */
        .ai-question-container {
            grid-column: 1 / 2;
            grid-row: 1 / 3;
            background-color: var(--card-background);
            border-radius: 12px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .intelex-agent-wrapper {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0px auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .intelex-agent-wrapper img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            z-index: 2;
        }
        
        .question-box {
            background-color: #2a2a2a;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            min-height: 100px;
            width: 100%;
            color: var(--text-color-light);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .question-box p {
            margin: 0;
            line-height: 1.5;
        }

        /* Animation for when the agent is "talking" */
        .agent-talking .talking-glow {
            animation: talking-pulse 1.5s infinite ease-in-out;
        }

        @keyframes talking-pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
        }

        .question-index {
            color: var(--primary-color);
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        /* New styles for the timers */
        .timer-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: 600;
        }
        
        .timer-container span {
            color: var(--text-color-faded);
        }

        #responseTimer {
            color: var(--primary-color);
        }

        #silenceTimer {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="interview-grid">
        
        <div class="user-video-container">
            <video id="userVideo" autoplay playsinline></video>
        </div>
        
        <div class="ai-question-container">
            <div class="intelex-agent-wrapper" id="agentWrapper">
                <img src="{{ url_for('static', filename='img/intelex_agent_static.png') }}" alt="InteleX AI Agent">
                <div class="intelex-agent-glow talking-glow"></div>
            </div>
            <h2 style="color:var(--text-color-light);">Hello. I am InteleX.</h2>
            <div class="question-box">
                <span id="questionIndex" class="question-index"></span>
                <p id="questionText">Please wait while your assessment is prepared...</p>
            </div>

            <div class="timer-container" id="timerContainer" style="display:none;">
                <span>Time Remaining: <span id="responseTimer">5:00</span></span>
                <span>Pause: <span id="silenceTimer">0</span>s</span>
            </div>

            <a href="#" class="next-button submit-button" id="submitButton" style="display:none;">Submit Answer</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            const userVideo = document.getElementById('userVideo');
            const agentWrapper = document.getElementById('agentWrapper');
            const questionTextElement = document.getElementById('questionText');
            const questionIndexElement = document.getElementById('questionIndex');
            const timerContainer = document.getElementById('timerContainer');
            const responseTimerDisplay = document.getElementById('responseTimer');
            const silenceTimerDisplay = document.getElementById('silenceTimer');

            let currentQuestionIndex = 0;
            const totalQuestions = {{ total_questions }};
            const userName = "{{ user_name }}";
            
            const synth = window.speechSynthesis;
            let humanLikeVoice = null;

            // Audio detection variables
            let audioContext;
            let analyser;
            let mediaStreamSource;
            let lastAudioTime = Date.now();
            let silenceTimerId;
            const SILENCE_LIMIT = 6; // 6 seconds
            
            const RESPONSE_TIME_LIMIT = 300;
            let responseTimerId;

            // Voice selection logic (remains the same)
            function findHumanLikeVoice() {
                const voices = synth.getVoices();
                let voice = voices.find(v => v.name.includes('Google') && v.lang.includes('en-US'));
                if (!voice) {
                    voice = voices.find(v => v.name.includes('Google') || v.name.includes('Microsoft'));
                }
                if (!voice) {
                    voice = voices.find(v => v.lang.includes('en-US') || v.lang.includes('en-GB'));
                }
                return voice || voices[0];
            }
            if ('speechSynthesis' in window) {
                synth.onvoiceschanged = () => { humanLikeVoice = findHumanLikeVoice(); };
            }
            
            function speak(text, onendCallback) {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    if (humanLikeVoice) {
                        utterance.voice = humanLikeVoice;
                        utterance.pitch = 1.0; 
                        utterance.rate = 1.0;
                    }
                    utterance.onstart = () => {
                        agentWrapper.classList.add('agent-talking');
                    };
                    utterance.onend = () => {
                        agentWrapper.classList.remove('agent-talking');
                        if (onendCallback) onendCallback();
                    };
                    synth.speak(utterance);
                }
            }

            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
            }

            // Start the response timer
            function startResponseTimer() {
                let timeLeft = RESPONSE_TIME_LIMIT;
                responseTimerDisplay.textContent = formatTime(timeLeft);
                responseTimerId = setInterval(() => {
                    timeLeft--;
                    responseTimerDisplay.textContent = formatTime(timeLeft);
                    if (timeLeft <= 0) {
                        clearInterval(responseTimerId);
                        // TODO: Implement submission logic here
                    }
                }, 1000);
            }

            // Start the silence timer and audio detection (FIXED LOGIC)
            function startAudioDetection(stream) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                mediaStreamSource = audioContext.createMediaStreamSource(stream);
                mediaStreamSource.connect(analyser);

                analyser.fftSize = 256;
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                let silenceTime = 0;
                silenceTimerId = setInterval(() => {
                    if (Date.now() - lastAudioTime > 1000) { // Check for activity every second
                        silenceTime++;
                        silenceTimerDisplay.textContent = `${silenceTime}s`;
                        if (silenceTime >= SILENCE_LIMIT) {
                            console.log("Silence detected. Auto-submitting.");
                            // TODO: Implement submission logic here
                        }
                    }
                }, 1000);

                function checkAudio() {
                    analyser.getByteFrequencyData(dataArray);
                    const average = dataArray.reduce((sum, value) => sum + value, 0) / dataArray.length;

                    if (average > 20) { // Increased sensitivity for better detection
                        lastAudioTime = Date.now();
                        silenceTime = 0; // Reset silence timer
                        silenceTimerDisplay.textContent = `0s`;
                    }
                    requestAnimationFrame(checkAudio);
                }

                requestAnimationFrame(checkAudio);
            }

            // The main interview flow
            function startInterview() {
                timerContainer.style.display = 'flex';
                askQuestion();
            }

            // Start camera and microphone (FIXED)
            function startMedia() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                        .then(stream => {
                            userVideo.srcObject = stream;
                            userVideo.play(); // Play the video
                            userVideo.onloadedmetadata = () => {
                                console.log("Media stream started.");
                                startAudioDetection(stream);
                                setTimeout(startInterview, 3000);
                            };
                        })
                        .catch(err => {
                            console.error("Error accessing media devices:", err);
                            alert("Error: Please allow camera and microphone access to begin.");
                        });
                } else {
                    alert("Your browser does not support the required features for this assessment.");
                }
            }
            
            function askQuestion() {
                 if (currentQuestionIndex < totalQuestions) {
                    let question_text_to_speak;
                    
                    if (currentQuestionIndex === 0) {
                        question_text_to_speak = `Hello ${userName}. Please introduce yourself and tell me a bit about your professional journey so far.`;
                        questionIndexElement.textContent = `Question 1 of ${totalQuestions}`;
                        questionTextElement.textContent = question_text_to_speak;
                        speak(question_text_to_speak, () => {
                            startResponseTimer();
                        });
                        currentQuestionIndex++;
                    } else {
                        fetch(`/get_question/${currentQuestionIndex}`)
                            .then(response => response.json())
                            .then(data => {
                                const question = data.question_text;
                                questionIndexElement.textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
                                questionTextElement.textContent = question;
                                speak(question, () => {
                                    startResponseTimer();
                                });
                                currentQuestionIndex++;
                            })
                            .catch(error => {
                                console.error('Error fetching question:', error);
                                questionTextElement.textContent = 'Error fetching question.';
                            });
                    }
                } else {
                    questionIndexElement.textContent = ``;
                    questionTextElement.textContent = "Assessment Complete.";
                    speak("Assessment Complete. Thank you for your time.");
                }
            }
            
            startMedia();
        });
    </script>
</body>
</html>
