{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Big Five Personality Analysis</h2>
    {% if traits %}
    <canvas id="traitChart" width="400" height="400"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ctx = document.getElementById('traitChart');
      const chart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: {{ traits.keys() | list | safe }},
          datasets: [{
            label: 'Trait Scores',
            data: {{ traits.values() | list | safe }},
            borderColor: '#00E4C8',
            backgroundColor: 'rgba(0, 228, 200, 0.2)',
            pointBackgroundColor: '#00FFBF',
            borderWidth: 2
          }]
        },
        options: {
          scales: {
            r: {
              angleLines: { color: '#1E1F22' },
              grid: { color: '#333' },
              pointLabels: { color: '#D8D8DA' },
              suggestedMin: 30,
              suggestedMax: 100
            }
          },
          plugins: { legend: { labels: { color: '#D8D8DA' } } }
        }
      });
    </script>
    {% else %}
    <p>No analysis data found. Please complete the interview first.</p>
    {% endif %}
</div>
{% endblock %}
