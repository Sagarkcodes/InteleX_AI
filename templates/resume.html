{% extends "base.html" %}

{% block content %}

<div class="resume-page">

    <h1 class="resume-title">Upload Your Resume</h1>

    {% if error %}
    <div class="error-message">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="resume-form">

        <label class="resume-label">
            Select Resume (PDF / Word)
        </label>

        <input 
            type="file"
            name="resume"
            class="resume-input"
            accept=".pdf,.doc,.docx"
            required
        >

        <button type="submit" class="resume-btn">
            Next
        </button>

    </form>

</div>

<style>

.resume-page{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:75vh;
    text-align:center;
}

.resume-title{
    color:#3ddc97;
    font-size:40px;
    margin-bottom:40px;
}

.resume-form{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:25px;
}

.resume-label{
    font-size:18px;
    color:white;
}

.resume-input{
    padding:10px;
    border-radius:6px;
    border:1px solid #2c2c2c;
    background:#0f172a;
    color:white;
    width:300px;
}

.resume-btn{
    margin-top:10px;
    background:#3ddc97;
    border:none;
    padding:10px 30px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.resume-btn:hover{
    opacity:0.9;
}

.error-message{
    color:#ff6b6b;
    margin-bottom:20px;
}

</style>

{% endblock %}
