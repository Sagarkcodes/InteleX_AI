{% extends "base.html" %}
{% block content %}

<section class="resume-section animate-fade-in">
  <div class="resume-container">
    <h2>Upload Your Resume</h2>
    <p class="resume-info">
      Upload your resume so our AI can tailor interview questions to your background and skills.
    </p>

    <form action="{{ url_for('resume') }}" method="POST" enctype="multipart/form-data" class="resume-form">
      <div class="upload-box">
        <label for="resume" class="upload-label">
          <span class="upload-icon">📄</span>
          <p>Select your resume file (PDF or DOCX)</p>
        </label>
        <input type="file" id="resume" name="resume" accept=".pdf,.docx" required>
      </div>

      <button type="submit" class="btn-upload">Upload & Continue</button>
    </form>
  </div>
</section>

{% endblock %}
