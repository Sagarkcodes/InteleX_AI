{% extends "base.html" %}
{% block content %}
<div class="no-navbar"></div>

<section class="video-layout">

    <!-- LEFT SIDE -->
    <div class="left-col">

        <!-- Floating Agent Avatar -->
        <img src="{{ url_for('static', filename='img/InteleX_logo.png') }}" 
             class="agent-avatar-video pulse-glow" />

        <!-- QUESTION BOX -->
        <div class="question-box-big">
            <h3>AI Question</h3>
            <p id="viQuestion">Preparing your interview…</p>
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-col">

        <!-- CAMERA -->
        <div class="camera-box-small">
            <video id="preview" autoplay playsinline muted></video>
        </div>

        <!-- TIMERS -->
        <div class="timers-row">
            <span>Time Left: <strong id="totalTimerDisplay">05:00</strong></span>
            <span>Pause Time: <strong id="pauseTimerDisplay">5s</strong></span>
        </div>

        <!-- INSTRUCTIONS -->
        <div class="instructions-box">
            <h3>Instructions</h3>
            <ul>
                <li>Keep your face centered in the camera.</li>
                <li>Maintain eye contact.</li>
                <li>No other devices allowed.</li>
                <li>You must start answering within 5 seconds.</li>
            </ul>
        </div>

    </div>

</section>

<script src="{{ url_for('static', filename='js/video_interview.js') }}"></script>
{% endblock %}
